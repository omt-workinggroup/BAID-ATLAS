<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Propertiq — Every property, in full</title>
    <meta name="description" content="Homes, apartments, offices and stores in Accra, with prices, floor plans, brochures and full galleries." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Propertiq" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:url" content="https://propertiq-gh.vercel.app/" />
    <link rel="canonical" href="https://propertiq-gh.vercel.app/" />
    <meta property="og:title" content="Propertiq — Every property, in full" />
    <meta property="og:description" content="Homes, apartments, offices and stores in Accra, with prices, floor plans, brochures and full galleries." />
    <meta property="og:image" content="https://propertiq-gh.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Propertiq: a modern home at dusk." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Propertiq — Every property, in full" />
    <meta name="twitter:description" content="Homes, apartments, offices and stores in Accra, with prices, floor plans, brochures and full galleries." />
    <meta name="twitter:image" content="https://propertiq-gh.vercel.app/og.jpg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/pages/properties.js"></script>
  </head>
  <body>
    <section class="props-hero" aria-labelledby="heading">
      <div class="props-hero__inner">
        <p class="overline" id="count-line">The portfolio</p>
        <h1 id="heading">Every property, <em>in full.</em></h1>
        <p class="props-hero__lede" id="lede">Homes, apartments, offices and stores in Accra, with prices, floor plans, brochures and full galleries.</p>
        <form class="search-pill search-pill--dark" role="search" id="search-form" action="/" method="get">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5" /></svg>
          <label for="q" class="sr-only">Search by area or name</label>
          <input id="q" name="q" placeholder="Search an area or a development" enterkeyhint="search" />
          <button type="submit" class="search-pill__go" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></button>
        </form>
        <nav class="chips chips--dark" aria-label="Filter" id="chips"></nav>
      </div>
    </section>
    <main id="main" class="page page--wide">
      <div class="props-layout">
        <div class="results-bar">
          <p class="small muted" aria-live="polite" id="results-count"></p>
          <nav class="view-switch" aria-label="View" id="view-switch"></nav>
          <label><span class="sr-only">Sort by</span>
            <select class="select" id="sort-select">
              <option value="newest">Featured first</option>
              <option value="price_asc">Price: low to high</option>
              <option value="price_desc">Price: high to low</option>
            </select></label>
        </div>
        <div class="props-split">
          <div class="pgrid" id="results" aria-busy="true"></div>
          <div class="map-panel" id="map-panel" hidden>
            <div class="map-frame">
              <div id="map" class="map" role="region" aria-label="Map of the properties"></div>
              <div class="map-top" id="map-top"></div>
              <div class="map-preview" id="map-preview" aria-live="polite"></div>
            </div>
            <p class="tiny muted" id="map-note">Pins mark the area, not the exact address.</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
