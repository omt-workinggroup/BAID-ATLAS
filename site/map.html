<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Map · Propertiq</title>
    <meta name="description" content="Every Propertiq development on a map of Accra." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Propertiq" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:url" content="https://propertiq-gh.vercel.app/map" />
    <link rel="canonical" href="https://propertiq-gh.vercel.app/map" />
    <meta property="og:title" content="Map · Propertiq" />
    <meta property="og:description" content="Every Propertiq development on a map of Accra." />
    <meta property="og:image" content="https://propertiq-gh.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Propertiq: a modern home at dusk." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Map · Propertiq" />
    <meta name="twitter:description" content="Every Propertiq development on a map of Accra." />
    <meta name="twitter:image" content="https://propertiq-gh.vercel.app/og.jpg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/pages/map.js"></script>
  </head>
  <body class="page-map">
    <main id="main" class="mapx">
      <aside class="mapx__panel" aria-label="Properties on the map">
        <div class="mapx__head">
          <div>
            <h1>Accra</h1>
            <p id="count" class="mapx__count"></p>
          </div>
          <div class="map-style" role="group" aria-label="Map style">
            <button type="button" data-style="map" aria-pressed="true">Map</button>
            <button type="button" data-style="satellite" aria-pressed="false">Satellite</button>
          </div>
        </div>
        <div class="mapx__filters" role="group" aria-label="Filter" id="filters"></div>
        <ul class="mapx__list" id="list"></ul>
      </aside>
      <div class="mapx__stage">
        <div id="map" class="mapx__map" role="region" aria-label="Map of the developments"></div>
        <div class="mapx__top">
          <label class="mapx__search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5" /></svg><span class="sr-only">Search the map</span><input id="map-q" type="search" placeholder="Search Ridge, Tse Addo…" /></label>
          <div class="mapx__chips" id="chips" role="group" aria-label="Filter"></div>
          <div class="map-style mapx__layers" role="group" aria-label="Map style">
            <button type="button" data-style="map" aria-pressed="true">Map</button>
            <button type="button" data-style="satellite" aria-pressed="false">Satellite</button>
          </div>
        </div>
        <div class="mapx__preview" id="preview" aria-live="polite"></div>
        <ul class="mapx__carousel" id="carousel" aria-label="Properties"></ul>
        <p class="mapx__note">Markers show the neighbourhood, not the exact plot.</p>
      </div>
    </main>
  </body>
</html>
