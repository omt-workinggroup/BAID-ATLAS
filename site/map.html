  </head>
  <body class="page-map">
    <main id="main" class="mapx" data-view="map">
      <aside class="mapx__panel" id="panel" aria-label="Properties on the map">
        <div class="mapx__head">
          <div>
            <h1>Accra</h1>
            <p id="count" class="mapx__count" aria-live="polite"></p>
          </div>
          <button type="button" class="mapx__filterbtn" data-open-filters><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4" /></svg>Filters<span class="mapx__dot" data-filter-dot hidden></span></button>
        </div>
        <ul class="mapx__list" id="list"></ul>
      </aside>
      <div class="mapx__stage">
        <div id="map" class="mapx__map" role="region" aria-label="Map of the properties"></div>
        <p class="mapx__loading" id="loading" role="status">Loading map…</p>
        <div class="mapx__top">
          <div class="mapx__bar">
            <label class="mapx__search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5" /></svg><span class="sr-only">Search the map</span><input id="map-q" type="search" placeholder="Search area or property" autocomplete="off" /></label>
            <button type="button" class="mapx__iconbtn" data-open-filters aria-label="Filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4" /></svg><span class="mapx__dot" data-filter-dot hidden></span></button>
          </div>
        </div>
        <div class="mapx__side">
          <div class="mtools">
            <button type="button" data-tool="layers" aria-label="Map style" aria-expanded="false" aria-controls="looks"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 9l9 5 9-5zM3 14l9 5 9-5" /></svg></button>
            <button type="button" data-tool="locate" aria-label="Show where I am"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" /></svg></button>
            <button type="button" data-tool="fit" aria-label="Show all properties"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg></button>
          </div>
          <div class="looks" role="group" aria-label="Map style" id="looks" hidden></div>
        </div>
        <p class="mapx__empty-map" id="nomatch" hidden>No properties match. <button type="button" class="text-link" data-reset>Clear filters</button></p>
        <section class="route" id="route" aria-label="Directions" aria-live="polite" hidden></section>
        <div class="mapx__preview" id="preview" aria-live="polite"></div>
        <button type="button" class="mapx__go" id="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 15V9a4 4 0 0 1 4-4h6M18 9v6a4 4 0 0 1-4 4H8" /></svg>Get directions</button>
        <div class="mapx__view" role="group" aria-label="View"><button type="button" data-view="map" aria-pressed="true">Map</button><button type="button" data-view="list" aria-pressed="false">List</button></div>
        <p class="mapx__note">Markers show the neighbourhood, not the exact plot.</p>
      </div>
      <dialog class="sheet" id="mfilters" aria-labelledby="mf-h"></dialog>
      <dialog class="sheet" id="mpick" aria-labelledby="mp-h"></dialog>
    </main>
  </body>
</html>
