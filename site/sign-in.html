<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sign in · Propertiq</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/supabase.js" defer></script>
    <script type="module" src="/js/pages/auth.js"></script>
  </head>
  <body>
    <main id="main" class="page page--narrow">
      <div class="stack-lg" style="padding-top: 1rem">
        <div class="page-head">
          <h1>Sign in</h1>
          <p>Use the phone number on your account.</p>
        </div>
        <div id="notice"></div>
        <form class="card card--lift stack" id="phone-form" novalidate>
          <input type="hidden" name="next" />
          <div class="field">
            <label for="f-phone">Phone number</label>
            <input class="input" id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="024 123 4567" required aria-describedby="f-phone-msg" />
            <p class="hint" id="f-phone-msg" data-hint="We'll text you a 6-digit code. Numbers outside Ghana need the country code, e.g. +44.">We'll text you a 6-digit code. Numbers outside Ghana need the country code, e.g. +44.</p>
          </div>
          <button type="submit" class="btn btn--full">Send code</button>
        </form>
        <p class="center small muted">New to Propertiq? <a class="link" href="/sign-up">Create an account</a></p>
      </div>
    </main>
  </body>
</html>
