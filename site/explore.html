<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Explore property · Propertiq</title>
    <meta name="description" content="Search moderated homes, land, rentals and commercial property across Ghana." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/vendor/supabase.js" defer></script>
    <script type="module" src="/js/pages/explore.js"></script>
  </head>
  <body>
    <main id="main" class="page page--wide">
      <div class="stack">
        <div class="stack-sm">
          <h1 id="heading">Explore property</h1>
          <div class="row">
            <form class="search-box" action="/explore" method="get" role="search" id="search-form">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="color: var(--muted); flex: none"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5" /></svg>
              <label for="q" class="sr-only">Search by place or title</label>
              <input id="q" name="q" placeholder="Area, city or reference (PQ-…)" enterkeyhint="search" />
            </form>
            <button type="button" class="icon-btn" id="open-filters" aria-haspopup="dialog" aria-label="Filters">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4" /></svg>
              <span class="badge-count" id="filter-count" hidden style="position: absolute; top: -6px; right: -6px; margin: 0; background: var(--primary)"></span>
            </button>
          </div>
          <nav class="chips" aria-label="Purpose" id="purpose-chips"></nav>
        </div>
        <div class="explore-layout">
          <aside class="explore-filters" aria-label="Filters">
      <!-- Filters sheet -->
        <dialog class="sheet" id="filters" aria-labelledby="filter-title">
          <form class="sheet__body" action="/explore" method="get" id="filter-form">
            <span class="sheet__grab" aria-hidden="true"></span>
            <div class="row-between">
              <h2 id="filter-title" style="font-size: 1.4rem">Filters</h2>
              <button type="button" class="btn btn--ghost btn--small" data-close>Close</button>
            </div>
            <input type="hidden" name="q" />
            <fieldset class="stack-sm" style="border: 0; padding: 0; margin: 0"><legend class="bold small" style="margin-bottom: 0.5rem">Looking to</legend><div class="row wrap" id="f-purpose"></div></fieldset>
            <fieldset class="stack-sm" style="border: 0; padding: 0; margin: 0"><legend class="bold small" style="margin-bottom: 0.5rem">Property type</legend><div class="row wrap" id="f-type"></div></fieldset>
            <fieldset class="stack-sm" style="border: 0; padding: 0; margin: 0">
              <legend class="bold small" style="margin-bottom: 0.5rem">Price</legend>
              <div style="display: grid; grid-template-columns: auto 1fr 1fr; gap: 0.5rem">
                <select class="select" name="currency" aria-label="Currency" style="padding: 0 0.5rem"><option>GHS</option><option>USD</option></select>
                <input class="input" name="min" inputmode="numeric" placeholder="Min" aria-label="Minimum price" />
                <input class="input" name="max" inputmode="numeric" placeholder="Max" aria-label="Maximum price" />
              </div>
              <p class="tiny muted">Prices are matched in the listing's own currency — we never convert them.</p>
            </fieldset>
            <fieldset class="stack-sm" style="border: 0; padding: 0; margin: 0"><legend class="bold small" style="margin-bottom: 0.5rem">Bedrooms</legend><div class="row wrap" id="f-beds"></div></fieldset>
            <fieldset class="stack-sm" style="border: 0; padding: 0; margin: 0"><legend class="bold small" style="margin-bottom: 0.5rem">Bathrooms</legend><div class="row wrap" id="f-baths"></div></fieldset>
            <fieldset class="stack-sm" style="border: 0; padding: 0; margin: 0"><legend class="bold small" style="margin-bottom: 0.5rem">Furnishing</legend><div class="row wrap" id="f-furnishing"></div></fieldset>
            <label class="check"><input type="checkbox" name="fresh" value="1" id="f-fresh" /><span>Availability confirmed in the last 30 days</span></label>
            <fieldset class="stack-sm" style="border: 0; padding: 0; margin: 0"><legend class="bold small" style="margin-bottom: 0.5rem">Sort by</legend><div class="row wrap" id="f-sort"></div></fieldset>
            <div class="row" style="position: sticky; bottom: 0; background: var(--surface); padding-top: 1rem; border-top: 1px solid var(--border)">
              <a class="link" href="/explore" id="clear-all">Clear all</a>
              <button type="submit" class="btn" style="flex: 1">Show results</button>
            </div>
          </form>
        </dialog>
          </aside>
          <section class="stack" aria-label="Results">
            <div class="results-bar">
              <p class="small muted" aria-live="polite" id="results-count"></p>
              <nav class="view-switch" aria-label="View" id="view-switch"></nav>
              <label class="sort-select"><span class="sr-only">Sort by</span>
                <select class="select" id="sort-select">
                  <option value="newest">Newest first</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option>
                </select></label>
            </div>
            <div class="active-filters" id="active-filters"></div>
            <div id="results-error"></div>
            <div class="explore-split">
              <div class="listing-grid listing-grid--results" id="results" aria-busy="true"></div>
              <div class="map-panel" id="map-panel" hidden>
                <div id="map" class="map" role="region" aria-label="Map of approximate listing areas"></div>
                <p class="tiny muted" id="map-note">Pins show the approximate area (about 1 km), never the exact address.</p>
              </div>
            </div>
            <div class="center"><button type="button" class="btn btn--secondary" id="load-more" hidden>Load more</button></div>
          </section>
        </div>
      </div>
    </main>

  </body>
</html>
