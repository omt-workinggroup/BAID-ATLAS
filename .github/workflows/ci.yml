name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, unit, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
          # Authenticated flow runs only when Supabase test phone numbers are configured as secrets.
          E2E_OWNER_PHONE: ${{ secrets.E2E_OWNER_PHONE }}
          E2E_MEMBER_PHONE: ${{ secrets.E2E_MEMBER_PHONE }}
          E2E_OTP: ${{ secrets.E2E_OTP }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            docs/screenshots/static/e2e
          retention-days: 14

  database:
    name: Migrations and RLS tests (Supabase stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Uses the Supabase CLI version pinned in package.json.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - run: pnpm exec supabase test db
      - run: pnpm exec supabase stop
        if: always()
