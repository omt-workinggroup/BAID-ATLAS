name: Deploy to Netlify

on:
  push:
    branches: [main, claude/dazzling-pasteur-kqzrut]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

env:
  NETLIFY_SITE_ID: af6bc06f-ab2c-48e8-b9c4-ff49b2afcf94

jobs:
  deploy:
    name: Deploy the static site (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://baid-atlas.netlify.app
    steps:
      - name: Check Netlify token
        id: token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret is not set; skipping deploy. Add it under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy site/ with Netlify CLI
        if: steps.token.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@23 deploy --dir site --prod --site "$NETLIFY_SITE_ID" --message "GitHub ${{ github.sha }}"
